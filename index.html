<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Workflow Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

  :root {
    --bg: #05050b;
    --panel: rgba(22, 20, 40, 0.55);
    --panel-solid: #100e1e;
    --text: #ece9f7;
    --muted: #8b85a8;
    --border: rgba(150, 120, 255, 0.16);
    --border-hi: rgba(168, 120, 255, 0.55);
    --purple: #a855f7;
    --purple-deep: #6d28d9;
    --gold: #f5c451;
    --danger: #ff5470;
    --display: 'Orbitron', 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
    --body: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: var(--body);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 48px 24px 90px;
    background: #05050b;
    position: relative;
  }
  /* Character backdrop (drop a file named bg.jpg next to index.html). */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2;
    background: url('bg.jpg') center top / cover no-repeat;
  }
  /* Dark + purple scrim so tiles and text stay legible over the art. */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(900px 600px at 80% 0%, rgba(124,58,237,0.26), transparent 60%),
      radial-gradient(760px 520px at 6% 14%, rgba(56,80,220,0.16), transparent 62%),
      linear-gradient(180deg, rgba(5,5,11,0.60) 0%, rgba(5,5,11,0.80) 55%, rgba(4,4,10,0.93) 100%);
  }
  .wrap { max-width: 940px; margin: 0 auto; position: relative; z-index: 1; }

  header { margin-bottom: 42px; position: relative; padding-left: 16px; }
  header::before {
    content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px;
    border-radius: 3px; background: linear-gradient(180deg, var(--purple), transparent);
    box-shadow: 0 0 14px rgba(168,85,247,0.8);
  }
  .greeting {
    font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase;
    background: linear-gradient(92deg, #fff 10%, var(--purple) 60%, var(--purple-deep) 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(168,85,247,0.45));
  }
  .clock {
    font-size: 15px; color: var(--muted); margin-top: 6px; letter-spacing: 0.12em;
    text-transform: uppercase; font-variant-numeric: tabular-nums;
  }

  .bar { display: flex; align-items: center; gap: 14px; margin: 40px 0 16px; }
  .section-title {
    font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: 0.22em;
    color: #cfc6ef; font-weight: 500; position: relative; padding-left: 16px;
  }
  .section-title::before {
    content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 10px var(--gold);
  }
  .back {
    background: rgba(168,85,247,0.08); border: 1px solid var(--border-hi); border-radius: 8px;
    color: #e7ddff; font-size: 13px; padding: 5px 14px; cursor: pointer; letter-spacing: 0.06em;
    font-family: var(--body); font-weight: 600; display: none; align-items: center; gap: 6px;
    transition: box-shadow .15s, background .15s;
  }
  .back:hover { background: rgba(168,85,247,0.2); box-shadow: 0 0 16px rgba(168,85,247,0.4); }
  .back.on { display: inline-flex; }

  .toolbar { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .tbtn {
    background: var(--panel); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 9px;
    color: #d9d2f0; font-size: 12px; padding: 7px 14px; cursor: pointer; letter-spacing: 0.06em;
    font-family: var(--body); font-weight: 600; transition: border-color .15s, box-shadow .15s;
  }
  .tbtn:hover { border-color: var(--border-hi); box-shadow: 0 0 16px rgba(124,58,237,0.35); }
  .storage-note { font-size: 12px; color: var(--muted); margin-top: 10px; letter-spacing: 0.03em; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
    gap: 14px;
  }
  .tile {
    background: var(--panel);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 16px;
    text-decoration: none;
    color: var(--text);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.35);
    transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    position: relative;
    display: block;
    cursor: pointer;
    text-align: left;
    width: 100%;
    overflow: hidden;
    font-family: var(--body);
  }
  .tile::after {
    content: ""; position: absolute; inset: 0; border-radius: 14px; pointer-events: none;
    background: radial-gradient(120px 80px at 80% 0%, rgba(168,85,247,0.18), transparent 70%);
    opacity: 0; transition: opacity .16s;
  }
  .tile:hover {
    transform: translateY(-3px); border-color: var(--border-hi);
    box-shadow: 0 0 0 1px rgba(168,85,247,0.25), 0 12px 34px rgba(76,29,149,0.45);
  }
  .tile:hover::after { opacity: 1; }
  .tile .ico {
    font-size: 24px; margin-bottom: 10px; display: block;
    filter: drop-shadow(0 0 8px rgba(168,85,247,0.35));
  }
  .tile .name { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; word-break: break-word; padding-right: 6px; }
  .tile .tag {
    font-size: 11px; color: var(--gold); margin-top: 4px; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; opacity: 0; transition: opacity .12s; z-index: 2; }
  .actions.left { left: 8px; right: auto; }
  .tile:hover .actions { opacity: 1; }
  .iconbtn {
    background: rgba(10,8,20,0.6); border: none; color: #b6acd6; font-size: 13px;
    line-height: 1; cursor: pointer; padding: 4px 5px; border-radius: 6px;
  }
  .iconbtn:hover { background: rgba(168,85,247,0.25); color: #fff; }
  .iconbtn.del:hover { background: rgba(255,84,112,0.22); color: var(--danger); }

  .add-tile {
    background: rgba(168,85,247,0.04);
    border: 1px dashed var(--border-hi);
    border-radius: 14px;
    padding: 16px;
    color: #a99fce;
    cursor: pointer;
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    min-height: 90px;
    transition: border-color .16s, color .16s, box-shadow .16s;
    font-family: var(--body);
  }
  .add-tile:hover { color: #fff; border-color: var(--purple); box-shadow: 0 0 20px rgba(124,58,237,0.35); }

  .notes-wrap {
    background: var(--panel); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.3);
  }
  textarea {
    width: 100%; min-height: 150px; border: none; background: none;
    color: var(--text); font-family: var(--body); font-size: 15px; padding: 18px;
    resize: vertical; outline: none; line-height: 1.6; letter-spacing: 0.01em;
  }
  textarea::placeholder { color: var(--muted); }

  .overlay {
    position: fixed; inset: 0; background: rgba(4,3,10,0.72);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; padding: 24px; z-index: 10;
  }
  .overlay.on { display: flex; }
  .modal {
    background: linear-gradient(180deg, rgba(28,24,52,0.96), rgba(14,12,26,0.96));
    border: 1px solid var(--border-hi); border-radius: 18px;
    padding: 26px; width: 100%; max-width: 390px;
    box-shadow: 0 0 40px rgba(76,29,149,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .modal h3 {
    font-family: var(--display); font-size: 16px; margin-bottom: 18px; letter-spacing: 0.1em;
    text-transform: uppercase; color: #fff;
  }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; letter-spacing: 0.08em; text-transform: uppercase; }
  .modal input[type=text] {
    width: 100%; padding: 11px 13px; border: 1px solid var(--border);
    border-radius: 9px; background: rgba(8,6,16,0.7); color: var(--text); font-size: 14px; font-family: var(--body);
  }
  .modal input:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 14px rgba(168,85,247,0.35); }
  .toggle { display: flex; align-items: center; gap: 8px; margin-top: 18px; font-size: 13px; color: #d9d2f0; cursor: pointer; letter-spacing: 0.03em; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--purple); }
  .modal .row { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1; padding: 11px; border-radius: 9px; border: 1px solid var(--border-hi);
    background: rgba(168,85,247,0.06); color: #e7ddff; font-size: 14px; cursor: pointer;
    font-family: var(--body); font-weight: 600; letter-spacing: 0.05em; transition: box-shadow .15s, background .15s;
  }
  .btn.primary {
    background: linear-gradient(92deg, var(--purple), var(--purple-deep));
    color: #fff; border-color: transparent;
    box-shadow: 0 0 18px rgba(124,58,237,0.5);
  }
  .btn:hover { box-shadow: 0 0 20px rgba(124,58,237,0.5); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 12px; letter-spacing: 0.02em; }
  #urlField.hide { display: none; }
  #folderToggle.hide { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="greeting" id="greeting">Hello</div>
    <div class="clock" id="clock"></div>
    <div class="toolbar">
      <button class="tbtn" id="exportBtn">⬇ Export backup</button>
      <button class="tbtn" id="importBtn">⬆ Import backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
    <div class="storage-note" id="storageNote"></div>
  </header>

  <div class="bar">
    <button class="back" id="backBtn">← Back</button>
    <div class="section-title" id="secTitle">Quick Links</div>
  </div>
  <div class="grid" id="linkGrid"></div>

  <div class="bar"><div class="section-title">Scratchpad</div></div>
  <div class="notes-wrap">
    <textarea id="notes" placeholder="Jot anything down — it saves automatically…"></textarea>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="mTitle">Add a link</h3>
    <label>Name</label>
    <input type="text" id="mName" placeholder="e.g. Marketing plan" autocomplete="off">
    <div id="urlField">
      <label>URL</label>
      <input type="text" id="mUrl" placeholder="https://…" autocomplete="off">
    </div>
    <label>Icon (emoji, optional)</label>
    <input type="text" id="mIco" placeholder="🔗" autocomplete="off">
    <label class="toggle" id="folderToggle"><input type="checkbox" id="mFolder"> Make this a folder (a group of links)</label>
    <div class="row">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn primary" id="mSave">Add</button>
    </div>
    <div class="hint" id="mHint">A folder opens its own page. Open it, then add links inside.</div>
  </div>
</div>

<script>
  const DEFAULTS = [
    { name: "Gmail",        url: "https://mail.google.com/mail/?ogbl#inbox", ico: "✉️", app: "googlegmail:///" },
    { name: "Calendar",     url: "https://calendar.google.com", ico: "📅" },
    { name: "Google Drive", url: "https://drive.google.com",    ico: "📁" },
    { name: "Docs", ico: "📄", children: [
        { name: "Marketing", ico: "📣", children: [
            { name: "Marcom Enquiry Tracker",            url: "https://docs.google.com/spreadsheets/d/1VIK4vjEU9M5TWjtnrymThlfP5w53lg_3/edit?usp=drivesdk&ouid=112759674037398170467&rtpof=true&sd=true", ico: "🐾" },
            { name: "Samples Tracker",                   url: "https://docs.google.com/spreadsheets/d/1uKVf4QB_tulIRNsGGZjvwSTyfwc-wuOY/edit", ico: "📊" },
            { name: "Campaign Budget tracker",           url: "https://docs.google.com/spreadsheets/d/1L-1zi_2EnGSIbAwPb-d_sdA0PMgA0bi2/edit?usp=drivesdk&ouid=112759674037398170467&rtpof=true&sd=true", ico: "💸" },
            { name: "Supplier List & Order Log",         url: "https://docs.google.com/spreadsheets/d/13V0IsDpp1kI0StssZp7Wjkkqv1diPq9O/edit?usp=drivesdk&ouid=112759674037398170467&rtpof=true&sd=true", ico: "👔" },
            { name: "Campaign Planning Execution Tracker", url: "https://docs.google.com/spreadsheets/d/1L-1zi_2EnGSIbAwPb-d_sdA0PMgA0bi2/edit?usp=drivesdk&ouid=112759674037398170467&rtpof=true&sd=true", ico: "🏕️" }
        ]},
        { name: "Sales", ico: "💼", children: [] }
    ]},
    { name: "GitHub",       url: "https://github.com",          ico: "🐙" },
    { name: "ChatGPT",      url: "https://chat.openai.com",     ico: "🤖" }
  ];

  const K_LINKS = "wh_links_v3";
  const K_NOTES = "wh_notes_v1";

  /* ---- storage: localStorage -> IndexedDB -> in-memory ---- */
  let storageMode = "memory";
  const mem = {};
  const DB_NAME = "hub_db", DB_STORE = "kv";

  function lsUsable() {
    try { const k = "__t" + Math.random(); localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  }
  function idbOpen() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  function idbGet(key) {
    return idbOpen().then(db => new Promise((res, rej) => {
      const t = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(key);
      t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
    }));
  }
  function idbSet(key, val) {
    return idbOpen().then(db => new Promise((res, rej) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put(val, key);
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
    }));
  }
  async function storeGet(key) {
    if (storageMode === "local") { try { return localStorage.getItem(key); } catch (e) {} }
    if (storageMode === "idb")   { try { return await idbGet(key); } catch (e) {} }
    return (key in mem) ? mem[key] : null;
  }
  async function storeSet(key, val) {
    if (storageMode === "local") { try { localStorage.setItem(key, val); return; } catch (e) {} }
    if (storageMode === "idb")   { try { await idbSet(key, val); return; } catch (e) {} }
    mem[key] = val;
  }
  function initStorage() {
    if (lsUsable()) storageMode = "local";
    else if (window.indexedDB) storageMode = "idb";
    else storageMode = "memory";
  }
  function saveLinks() { storeSet(K_LINKS, JSON.stringify(links)); }

  let links = DEFAULTS.slice();
  let path = [];        // trail of folder indices from the top; [] = top level
  let editIdx = null;   // null = adding, else index being edited in current list

  const grid = document.getElementById("linkGrid");
  const backBtn = document.getElementById("backBtn");
  const secTitle = document.getElementById("secTitle");

  function currentList() {
    let list = links;
    for (const i of path) list = list[i].children;
    return list;
  }
  function crumb() {
    let list = links; const parts = ["Quick Links"];
    for (const i of path) { parts.push(list[i].name); list = list[i].children; }
    return parts.join("  ›  ");
  }
  function isFolder(item) { return Array.isArray(item.children); }

  function normalizeUrl(u) {
    if (!u) return "#";
    // Leave any real scheme alone (https://, googlegmail://, mailto:, etc.)
    if (/^[a-z][a-z0-9+.\-]*:/i.test(u)) return u;
    return "https://" + u;
  }
  function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  // Try to open a native app via its URL scheme; fall back to the web URL
  // if the app doesn't take over (desktop, or app not installed).
  // Uses a time-based check: if the app opens, iOS suspends this page, so the
  // timer fires "late" — we detect that gap and skip the web fallback.
  function openApp(appUrl, webUrl) {
    const start = Date.now();
    setTimeout(() => {
      if (Date.now() - start < 1500) window.location.href = webUrl; // app didn't open
    }, 1000);
    window.location.href = appUrl; // attempt the app
  }

  function render() {
    const list = currentList();
    grid.innerHTML = "";

    if (path.length === 0) {
      backBtn.classList.remove("on");
      secTitle.textContent = "Quick Links";
    } else {
      backBtn.classList.add("on");
      secTitle.textContent = crumb();
    }

    list.forEach((item, i) => {
      const moves =
        '<span class="actions left">' +
          (i > 0 ? '<button class="iconbtn mv" title="Move left" data-move="'+i+'" data-dir="-1">◀</button>' : '') +
          (i < list.length - 1 ? '<button class="iconbtn mv" title="Move right" data-move="'+i+'" data-dir="1">▶</button>' : '') +
        '</span>';
      const actions =
        '<span class="actions">' +
          '<button class="iconbtn edit" title="Edit" data-edit="'+i+'">✎</button>' +
          '<button class="iconbtn del" title="Remove" data-del="'+i+'">×</button>' +
        '</span>' + moves;
      let el;
      if (isFolder(item)) {
        el = document.createElement("button");
        el.className = "tile";
        el.innerHTML = actions +
          '<span class="ico">'+(item.ico || "📁")+'</span>' +
          '<span class="name">'+escapeHtml(item.name)+'</span>' +
          '<span class="tag">'+item.children.length+' item'+(item.children.length===1?'':'s')+'</span>';
        el.addEventListener("click", (e) => {
          if (e.target.closest(".actions")) return;
          path.push(i); render();
        });
      } else {
        el = document.createElement("a");
        el.className = "tile";
        el.href = normalizeUrl(item.url);
        el.target = "_blank";
        el.rel = "noopener";
        el.innerHTML = actions +
          '<span class="ico">'+(item.ico || "🔗")+'</span>' +
          '<span class="name">'+escapeHtml(item.name)+'</span>';
        if (item.app) {
          el.addEventListener("click", (e) => {
            if (e.target.closest(".actions")) return;
            e.preventDefault();
            openApp(item.app, normalizeUrl(item.url));
          });
        }
      }
      grid.appendChild(el);
    });

    const add = document.createElement("button");
    add.className = "add-tile";
    add.textContent = path.length === 0 ? "+ Add" : "+ Add to this folder";
    add.onclick = () => openModal();
    grid.appendChild(add);
  }

  backBtn.onclick = () => { path.pop(); render(); };

  grid.addEventListener("click", (e) => {
    const del = e.target.closest(".del");
    if (del) {
      e.preventDefault(); e.stopPropagation();
      currentList().splice(+del.dataset.del, 1);
      saveLinks(); render(); return;
    }
    const ed = e.target.closest(".edit");
    if (ed) {
      e.preventDefault(); e.stopPropagation();
      openModal(+ed.dataset.edit); return;
    }
    const mv = e.target.closest(".mv");
    if (mv) {
      e.preventDefault(); e.stopPropagation();
      const i = +mv.dataset.move, dir = +mv.dataset.dir, j = i + dir;
      const list = currentList();
      if (j >= 0 && j < list.length) {
        [list[i], list[j]] = [list[j], list[i]];
        saveLinks(); render();
      }
      return;
    }
  });

  // modal
  const overlay = document.getElementById("overlay");
  const mName = document.getElementById("mName");
  const mUrl = document.getElementById("mUrl");
  const mIco = document.getElementById("mIco");
  const mFolder = document.getElementById("mFolder");
  const urlField = document.getElementById("urlField");
  const folderToggle = document.getElementById("folderToggle");
  const mTitle = document.getElementById("mTitle");
  const mSaveBtn = document.getElementById("mSave");
  const mHint = document.getElementById("mHint");

  function syncFolderToggle() {
    if (mFolder.checked) { urlField.classList.add("hide"); }
    else { urlField.classList.remove("hide"); }
  }
  mFolder.addEventListener("change", syncFolderToggle);

  function openModal(idx){
    overlay.classList.add("on");
    editIdx = (typeof idx === "number") ? idx : null;

    if (editIdx !== null) {
      // editing existing item
      const item = currentList()[editIdx];
      const folder = isFolder(item);
      mTitle.textContent = folder ? "Edit folder" : "Edit link";
      mSaveBtn.textContent = "Save";
      mName.value = item.name || "";
      mUrl.value = folder ? "" : (item.url || "");
      mIco.value = item.ico || "";
      folderToggle.classList.add("hide");   // can't switch type when editing
      mFolder.checked = folder;
      urlField.classList.toggle("hide", folder);
      mHint.textContent = folder ? "Rename the folder or change its icon." : "Change the name, URL, or icon.";
    } else {
      // adding new
      mTitle.textContent = "Add a link";
      mSaveBtn.textContent = "Add";
      mName.value=""; mUrl.value=""; mIco.value=""; mFolder.checked=false;
      // folders can be created at any level now
      folderToggle.classList.remove("hide");
      mHint.textContent = "A folder opens its own page. Open it, then add links (or more folders) inside.";
      syncFolderToggle();
    }
    mName.focus();
  }
  function closeModal(){ overlay.classList.remove("on"); editIdx = null; }
  document.getElementById("mCancel").onclick = closeModal;
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });

  mSaveBtn.onclick = () => {
    const name = mName.value.trim();
    if (!name) return;
    const list = currentList();

    if (editIdx !== null) {
      const item = list[editIdx];
      item.name = name;
      item.ico = mIco.value.trim();
      if (!isFolder(item)) {
        const url = mUrl.value.trim();
        if (!url) return;
        item.url = url;
      }
    } else if (mFolder.checked) {
      list.push({ name, ico: mIco.value.trim(), children: [] });
    } else {
      const url = mUrl.value.trim();
      if (!url) return;
      list.push({ name, url, ico: mIco.value.trim() });
    }
    saveLinks(); render(); closeModal();
  };

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    if (e.key === "Enter" && overlay.classList.contains("on")) mSaveBtn.click();
  });

  // notes
  const notes = document.getElementById("notes");
  notes.addEventListener("input", () => storeSet(K_NOTES, notes.value));

  // export / import backup
  function download(filename, text) {
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  document.getElementById("exportBtn").onclick = () => {
    const data = { links, notes: notes.value, exportedAt: new Date().toISOString() };
    download("hub-backup.json", JSON.stringify(data, null, 2));
  };
  const importFile = document.getElementById("importFile");
  document.getElementById("importBtn").onclick = () => importFile.click();
  importFile.addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (Array.isArray(data.links)) { links = data.links; path = []; saveLinks(); render(); }
        if (typeof data.notes === "string") { notes.value = data.notes; storeSet(K_NOTES, data.notes); }
        alert("Backup imported successfully.");
      } catch (err) { alert("Couldn't read that file — make sure it's a hub-backup.json."); }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  // clock + greeting
  function tick() {
    const now = new Date();
    const h = now.getHours();
    const g = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    document.getElementById("greeting").textContent = g;
    document.getElementById("clock").textContent = now.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric"
    }) + " · " + now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }
  tick(); setInterval(tick, 1000 * 15);

  // boot: pick storage, load saved data, then render
  async function boot() {
    initStorage();
    const rawLinks = await storeGet(K_LINKS);
    if (rawLinks) { try { links = JSON.parse(rawLinks); } catch (e) {} }
    const rawNotes = await storeGet(K_NOTES);
    notes.value = rawNotes || "";
    render();

    const note = document.getElementById("storageNote");
    if (storageMode === "local") note.textContent = "Saved in this browser. Export a backup to keep a copy or use it on another device.";
    else if (storageMode === "idb") note.textContent = "Browser storage limited here — using IndexedDB. Export a backup to be safe.";
    else note.textContent = "⚠ This page can't save here (likely opened as a local file or in preview). Changes last only this session — host it on GitHub Pages, or use Export/Import.";
  }
  boot();
</script>
</body>
</html>
