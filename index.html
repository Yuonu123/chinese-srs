<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Workflow Hub</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #8a8a8a;
    --border: #ececec;
    --accent: #2b2b2b;
    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10;
      --card: #1a1a1c;
      --text: #f0f0f0;
      --muted: #7a7a7e;
      --border: #2a2a2d;
      --accent: #f0f0f0;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 48px 24px 80px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  header { margin-bottom: 40px; }
  .greeting { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .clock { font-size: 15px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

  .bar { display: flex; align-items: center; gap: 12px; margin: 36px 0 14px; }
  .section-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600;
  }
  .back {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 13px; padding: 5px 12px; cursor: pointer;
    font-family: inherit; display: none; align-items: center; gap: 6px;
  }
  .back:hover { border-color: var(--muted); }
  .back.on { display: inline-flex; }

  .toolbar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .tbtn {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 12px; padding: 6px 12px; cursor: pointer;
    font-family: inherit; box-shadow: var(--shadow);
  }
  .tbtn:hover { border-color: var(--muted); }
  .storage-note { font-size: 11px; color: var(--muted); margin-top: 8px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 16px 16px 16px;
    text-decoration: none;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
    position: relative;
    display: block;
    cursor: pointer;
    text-align: left;
    width: 100%;
    font-family: inherit;
  }
  .tile:hover { transform: translateY(-2px); border-color: var(--muted); }
  .tile .ico { font-size: 22px; margin-bottom: 8px; display: block; }
  .tile .name { font-size: 14px; font-weight: 500; word-break: break-word; padding-right: 6px; }
  .tile .tag { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
  .actions.left { left: 8px; right: auto; }
  .tile:hover .actions { opacity: 1; }
  .iconbtn {
    background: none; border: none; color: var(--muted); font-size: 14px;
    line-height: 1; cursor: pointer; padding: 3px; border-radius: 5px;
  }
  .iconbtn:hover { background: var(--bg); color: var(--text); }
  .iconbtn.del:hover { color: #e5484d; }

  .add-tile {
    background: none;
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 16px;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    min-height: 84px;
    transition: border-color .12s, color .12s;
    font-family: inherit;
  }
  .add-tile:hover { border-color: var(--muted); color: var(--text); }

  .notes-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  textarea {
    width: 100%; min-height: 160px; border: none; background: none;
    color: var(--text); font-family: inherit; font-size: 15px; padding: 18px;
    resize: vertical; outline: none; line-height: 1.6;
  }
  textarea::placeholder { color: var(--muted); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; padding: 24px; z-index: 10;
  }
  .overlay.on { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; width: 100%; max-width: 380px;
  }
  .modal h3 { font-size: 17px; margin-bottom: 16px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
  .modal input[type=text] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit;
  }
  .modal input:focus { outline: none; border-color: var(--muted); }
  .toggle { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: var(--text); cursor: pointer; }
  .toggle input { width: 16px; height: 16px; }
  .modal .row { display: flex; gap: 8px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 500; }
  .btn:hover { opacity: .85; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  #urlField.hide { display: none; }
  #folderToggle.hide { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="greeting" id="greeting">Hello</div>
    <div class="clock" id="clock"></div>
    <div class="toolbar">
      <button class="tbtn" id="exportBtn">⬇ Export backup</button>
      <button class="tbtn" id="importBtn">⬆ Import backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
    <div class="storage-note" id="storageNote"></div>
  </header>

  <div class="bar">
    <button class="back" id="backBtn">← Back</button>
    <div class="section-title" id="secTitle">Quick Links</div>
  </div>
  <div class="grid" id="linkGrid"></div>

  <div class="bar"><div class="section-title">Scratchpad</div></div>
  <div class="notes-wrap">
    <textarea id="notes" placeholder="Jot anything down — it saves automatically…"></textarea>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="mTitle">Add a link</h3>
    <label>Name</label>
    <input type="text" id="mName" placeholder="e.g. Marketing plan" autocomplete="off">
    <div id="urlField">
      <label>URL</label>
      <input type="text" id="mUrl" placeholder="https://…" autocomplete="off">
    </div>
    <label>Icon (emoji, optional)</label>
    <input type="text" id="mIco" placeholder="🔗" autocomplete="off">
    <label class="toggle" id="folderToggle"><input type="checkbox" id="mFolder"> Make this a folder (a group of links)</label>
    <div class="row">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn primary" id="mSave">Add</button>
    </div>
    <div class="hint" id="mHint">A folder opens its own page. Open it, then add links inside.</div>
  </div>
</div>

<script>
  const DEFAULTS = [
    { name: "Gmail",        url: "https://mail.google.com/mail/?ogbl#inbox", ico: "✉️", app: "googlegmail:///" },
    { name: "Calendar",     url: "https://calendar.google.com", ico: "📅" },
    { name: "Google Drive", url: "https://drive.google.com",    ico: "📁" },
    { name: "Docs", ico: "📄", children: [
        { name: "Marketing", ico: "📣", children: [
            { name: "Marcom Enquiry Tracker",            url: "https://docs.google.com/spreadsheets/d/1VIK4vjEU9M5TWjtnrymThlfP5w53lg_3/edit?usp=drivesdk&ouid=112759674037398170467&rtpof=true&sd=true", ico: "🐾" },
            { name: "Samples Tracker",                   url: "https://docs.google.com/spreadsheets/d/1uKVf4QB_tulIRNsGGZjvwSTyfwc-wuOY/edit", ico: "📊" },
            { name: "Campaign Budget tracker",           url: "https://docs.google.com/spreadsheets/d/1L-1zi_2EnGSIbAwPb-d_sdA0PMgA0bi2/edit?usp=drivesdk&ouid=112759674037398170467&rtpof=true&sd=true", ico: "💸" },
            { name: "Supplier List & Order Log",         url: "https://docs.google.com/spreadsheets/d/13V0IsDpp1kI0StssZp7Wjkkqv1diPq9O/edit?usp=drivesdk&ouid=112759674037398170467&rtpof=true&sd=true", ico: "👔" },
            { name: "Campaign Planning Execution Tracker", url: "https://docs.google.com/spreadsheets/d/1L-1zi_2EnGSIbAwPb-d_sdA0PMgA0bi2/edit?usp=drivesdk&ouid=112759674037398170467&rtpof=true&sd=true", ico: "🏕️" }
        ]},
        { name: "Sales", ico: "💼", children: [] }
    ]},
    { name: "GitHub",       url: "https://github.com",          ico: "🐙" },
    { name: "ChatGPT",      url: "https://chat.openai.com",     ico: "🤖" }
  ];

  const K_LINKS = "wh_links_v3";
  const K_NOTES = "wh_notes_v1";

  /* ---- storage: localStorage -> IndexedDB -> in-memory ---- */
  let storageMode = "memory";
  const mem = {};
  const DB_NAME = "hub_db", DB_STORE = "kv";

  function lsUsable() {
    try { const k = "__t" + Math.random(); localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  }
  function idbOpen() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  function idbGet(key) {
    return idbOpen().then(db => new Promise((res, rej) => {
      const t = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(key);
      t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
    }));
  }
  function idbSet(key, val) {
    return idbOpen().then(db => new Promise((res, rej) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put(val, key);
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
    }));
  }
  async function storeGet(key) {
    if (storageMode === "local") { try { return localStorage.getItem(key); } catch (e) {} }
    if (storageMode === "idb")   { try { return await idbGet(key); } catch (e) {} }
    return (key in mem) ? mem[key] : null;
  }
  async function storeSet(key, val) {
    if (storageMode === "local") { try { localStorage.setItem(key, val); return; } catch (e) {} }
    if (storageMode === "idb")   { try { await idbSet(key, val); return; } catch (e) {} }
    mem[key] = val;
  }
  function initStorage() {
    if (lsUsable()) storageMode = "local";
    else if (window.indexedDB) storageMode = "idb";
    else storageMode = "memory";
  }
  function saveLinks() { storeSet(K_LINKS, JSON.stringify(links)); }

  let links = DEFAULTS.slice();
  let path = [];        // trail of folder indices from the top; [] = top level
  let editIdx = null;   // null = adding, else index being edited in current list

  const grid = document.getElementById("linkGrid");
  const backBtn = document.getElementById("backBtn");
  const secTitle = document.getElementById("secTitle");

  function currentList() {
    let list = links;
    for (const i of path) list = list[i].children;
    return list;
  }
  function crumb() {
    let list = links; const parts = ["Quick Links"];
    for (const i of path) { parts.push(list[i].name); list = list[i].children; }
    return parts.join("  ›  ");
  }
  function isFolder(item) { return Array.isArray(item.children); }

  function normalizeUrl(u) {
    if (!u) return "#";
    // Leave any real scheme alone (https://, googlegmail://, mailto:, etc.)
    if (/^[a-z][a-z0-9+.\-]*:/i.test(u)) return u;
    return "https://" + u;
  }
  function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  // Try to open a native app via its URL scheme; fall back to the web URL
  // if the app doesn't take over (desktop, or app not installed).
  // Uses a time-based check: if the app opens, iOS suspends this page, so the
  // timer fires "late" — we detect that gap and skip the web fallback.
  function openApp(appUrl, webUrl) {
    const start = Date.now();
    setTimeout(() => {
      if (Date.now() - start < 1500) window.location.href = webUrl; // app didn't open
    }, 1000);
    window.location.href = appUrl; // attempt the app
  }

  function render() {
    const list = currentList();
    grid.innerHTML = "";

    if (path.length === 0) {
      backBtn.classList.remove("on");
      secTitle.textContent = "Quick Links";
    } else {
      backBtn.classList.add("on");
      secTitle.textContent = crumb();
    }

    list.forEach((item, i) => {
      const moves =
        '<span class="actions left">' +
          (i > 0 ? '<button class="iconbtn mv" title="Move left" data-move="'+i+'" data-dir="-1">◀</button>' : '') +
          (i < list.length - 1 ? '<button class="iconbtn mv" title="Move right" data-move="'+i+'" data-dir="1">▶</button>' : '') +
        '</span>';
      const actions =
        '<span class="actions">' +
          '<button class="iconbtn edit" title="Edit" data-edit="'+i+'">✎</button>' +
          '<button class="iconbtn del" title="Remove" data-del="'+i+'">×</button>' +
        '</span>' + moves;
      let el;
      if (isFolder(item)) {
        el = document.createElement("button");
        el.className = "tile";
        el.innerHTML = actions +
          '<span class="ico">'+(item.ico || "📁")+'</span>' +
          '<span class="name">'+escapeHtml(item.name)+'</span>' +
          '<span class="tag">'+item.children.length+' item'+(item.children.length===1?'':'s')+'</span>';
        el.addEventListener("click", (e) => {
          if (e.target.closest(".actions")) return;
          path.push(i); render();
        });
      } else {
        el = document.createElement("a");
        el.className = "tile";
        el.href = normalizeUrl(item.url);
        el.target = "_blank";
        el.rel = "noopener";
        el.innerHTML = actions +
          '<span class="ico">'+(item.ico || "🔗")+'</span>' +
          '<span class="name">'+escapeHtml(item.name)+'</span>';
        if (item.app) {
          el.addEventListener("click", (e) => {
            if (e.target.closest(".actions")) return;
            e.preventDefault();
            openApp(item.app, normalizeUrl(item.url));
          });
        }
      }
      grid.appendChild(el);
    });

    const add = document.createElement("button");
    add.className = "add-tile";
    add.textContent = path.length === 0 ? "+ Add" : "+ Add to this folder";
    add.onclick = () => openModal();
    grid.appendChild(add);
  }

  backBtn.onclick = () => { path.pop(); render(); };

  grid.addEventListener("click", (e) => {
    const del = e.target.closest(".del");
    if (del) {
      e.preventDefault(); e.stopPropagation();
      currentList().splice(+del.dataset.del, 1);
      saveLinks(); render(); return;
    }
    const ed = e.target.closest(".edit");
    if (ed) {
      e.preventDefault(); e.stopPropagation();
      openModal(+ed.dataset.edit); return;
    }
    const mv = e.target.closest(".mv");
    if (mv) {
      e.preventDefault(); e.stopPropagation();
      const i = +mv.dataset.move, dir = +mv.dataset.dir, j = i + dir;
      const list = currentList();
      if (j >= 0 && j < list.length) {
        [list[i], list[j]] = [list[j], list[i]];
        saveLinks(); render();
      }
      return;
    }
  });

  // modal
  const overlay = document.getElementById("overlay");
  const mName = document.getElementById("mName");
  const mUrl = document.getElementById("mUrl");
  const mIco = document.getElementById("mIco");
  const mFolder = document.getElementById("mFolder");
  const urlField = document.getElementById("urlField");
  const folderToggle = document.getElementById("folderToggle");
  const mTitle = document.getElementById("mTitle");
  const mSaveBtn = document.getElementById("mSave");
  const mHint = document.getElementById("mHint");

  function syncFolderToggle() {
    if (mFolder.checked) { urlField.classList.add("hide"); }
    else { urlField.classList.remove("hide"); }
  }
  mFolder.addEventListener("change", syncFolderToggle);

  function openModal(idx){
    overlay.classList.add("on");
    editIdx = (typeof idx === "number") ? idx : null;

    if (editIdx !== null) {
      // editing existing item
      const item = currentList()[editIdx];
      const folder = isFolder(item);
      mTitle.textContent = folder ? "Edit folder" : "Edit link";
      mSaveBtn.textContent = "Save";
      mName.value = item.name || "";
      mUrl.value = folder ? "" : (item.url || "");
      mIco.value = item.ico || "";
      folderToggle.classList.add("hide");   // can't switch type when editing
      mFolder.checked = folder;
      urlField.classList.toggle("hide", folder);
      mHint.textContent = folder ? "Rename the folder or change its icon." : "Change the name, URL, or icon.";
    } else {
      // adding new
      mTitle.textContent = "Add a link";
      mSaveBtn.textContent = "Add";
      mName.value=""; mUrl.value=""; mIco.value=""; mFolder.checked=false;
      // folders can be created at any level now
      folderToggle.classList.remove("hide");
      mHint.textContent = "A folder opens its own page. Open it, then add links (or more folders) inside.";
      syncFolderToggle();
    }
    mName.focus();
  }
  function closeModal(){ overlay.classList.remove("on"); editIdx = null; }
  document.getElementById("mCancel").onclick = closeModal;
  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });

  mSaveBtn.onclick = () => {
    const name = mName.value.trim();
    if (!name) return;
    const list = currentList();

    if (editIdx !== null) {
      const item = list[editIdx];
      item.name = name;
      item.ico = mIco.value.trim();
      if (!isFolder(item)) {
        const url = mUrl.value.trim();
        if (!url) return;
        item.url = url;
      }
    } else if (mFolder.checked) {
      list.push({ name, ico: mIco.value.trim(), children: [] });
    } else {
      const url = mUrl.value.trim();
      if (!url) return;
      list.push({ name, url, ico: mIco.value.trim() });
    }
    saveLinks(); render(); closeModal();
  };

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    if (e.key === "Enter" && overlay.classList.contains("on")) mSaveBtn.click();
  });

  // notes
  const notes = document.getElementById("notes");
  notes.addEventListener("input", () => storeSet(K_NOTES, notes.value));

  // export / import backup
  function download(filename, text) {
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  document.getElementById("exportBtn").onclick = () => {
    const data = { links, notes: notes.value, exportedAt: new Date().toISOString() };
    download("hub-backup.json", JSON.stringify(data, null, 2));
  };
  const importFile = document.getElementById("importFile");
  document.getElementById("importBtn").onclick = () => importFile.click();
  importFile.addEventListener("change", (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (Array.isArray(data.links)) { links = data.links; path = []; saveLinks(); render(); }
        if (typeof data.notes === "string") { notes.value = data.notes; storeSet(K_NOTES, data.notes); }
        alert("Backup imported successfully.");
      } catch (err) { alert("Couldn't read that file — make sure it's a hub-backup.json."); }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  // clock + greeting
  function tick() {
    const now = new Date();
    const h = now.getHours();
    const g = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    document.getElementById("greeting").textContent = g;
    document.getElementById("clock").textContent = now.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric"
    }) + " · " + now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }
  tick(); setInterval(tick, 1000 * 15);

  // boot: pick storage, load saved data, then render
  async function boot() {
    initStorage();
    const rawLinks = await storeGet(K_LINKS);
    if (rawLinks) { try { links = JSON.parse(rawLinks); } catch (e) {} }
    const rawNotes = await storeGet(K_NOTES);
    notes.value = rawNotes || "";
    render();

    const note = document.getElementById("storageNote");
    if (storageMode === "local") note.textContent = "Saved in this browser. Export a backup to keep a copy or use it on another device.";
    else if (storageMode === "idb") note.textContent = "Browser storage limited here — using IndexedDB. Export a backup to be safe.";
    else note.textContent = "⚠ This page can't save here (likely opened as a local file or in preview). Changes last only this session — host it on GitHub Pages, or use Export/Import.";
  }
  boot();
</script>
</body>
</html>
